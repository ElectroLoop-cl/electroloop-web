[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# ──────────────────────────────────────────
# ETAPA 3.3: Performance Optimization Headers
# ──────────────────────────────────────────

# Cache assets (images, fonts, CSS, JS)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache static assets
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML pages cache (shorter)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"


# Páginas internas (firmas, brochure, presentación): accesibles pero fuera de Google
[[headers]]
  for = "/brochure.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/presentacion.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/email-signature.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/email-signature-nicolas.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/firma-nicolas.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/firma-preview.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/firma-preview-simple.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/e/satisfaccion/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Link = "</fonts/fonts.css>; rel=preload; as=style, </favicon.png>; rel=preload; as=image"
